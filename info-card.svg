<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 490" width="490" height="490">
<defs>
  <style>
    .card-bg { fill: #0d1117; rx: 8px; ry: 8px; stroke: #30363d; stroke-width: 1px; }
    .header-dot { rx: 50%; ry: 50%; }
    .title-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; font-weight: 600; }
    .term-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .user-title { fill: #58a6ff; font-weight: bold; font-size: 15px; }
    .host-title { fill: #bc8cff; font-weight: bold; font-size: 15px; }
    .separator { stroke: #30363d; stroke-width: 1px; }
    .key { fill: #79c0ff; font-weight: 600; }
    .val { fill: #c9d1d9; }
    .val-highlight { fill: #7ee787; font-weight: 500; }
    .prompt { fill: #d2a8ff; font-weight: bold; }
    .fade-line { opacity: 0; transform: translateY(6px); animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  </style>
</defs>
<rect class="card-bg" width="490" height="490" />
<circle class="header-dot" cx="20" cy="18" r="5" fill="#ff5f56" />
<circle class="header-dot" cx="35" cy="18" r="5" fill="#ffbd2e" />
<circle class="header-dot" cx="50" cy="18" r="5" fill="#27c93f" />
<text class="title-text" x="245" y="22" text-anchor="middle">neofetch --user info-card.svg</text>
<line x1="0" y1="32" x2="490" y2="32" stroke="#21262d" stroke-width="1" />
<g class="fade-line" style="animation-delay: 0.10s;">
